name: Rust CI

permissions:
  contents: read

on:
  # Integration branches only: a topic branch that also has a pull request
  # would otherwise run the job twice for one commit, and it draws from the
  # org's five-slot macOS pool.
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job for every target: the three clippy passes and the tests share the
  # dependency cache, and one runner working through them in a row gets
  # through the macOS queue sooner than a matrix waiting on three. The iOS
  # passes need the iOS SDK, which only a macOS runner has.
  rust:
    name: rust
    runs-on: macos-26
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (macOS)
        run: cargo clippy --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Clippy (iOS)
        run: cargo clippy --all-targets --locked --target aarch64-apple-ios -- -D warnings
      - name: Clippy (iOS simulator)
        run: cargo clippy --all-targets --locked --target aarch64-apple-ios-sim -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs every case — libtest units and the native suite alike —
      # in its own process; the native binary then runs its case on that
      # process's real main thread.
      - name: Test (macOS)
        run: cargo nextest run -p cocoa-ui --locked
      - name: Doctests
        run: cargo test -p cocoa-ui --locked --doc
      # The same suite natively on the iOS simulator: every test binary is
      # handed to the `aarch64-apple-ios-sim` target runner
      # (`.cargo/config.toml` → `.github/scripts/nextest-ios-sim.sh`), which
      # spawns it inside a simulator this job created and owns — so each
      # native case keeps nextest's one-process-per-case isolation, and no
      # other job's UIKit state leaks in. Deleting the device afterwards is
      # unconditional cleanup, not part of the verdict.
      - name: Create the iOS test simulator
        id: ios-sim
        run: |
          runtime="$(xcrun simctl list runtimes --json \
            | jq -er '[.runtimes[] | select(.isAvailable and (.identifier | contains("SimRuntime.iOS")))]
              | last | .identifier')"
          echo "runtime: $runtime"
          # productFamily "iPhone" includes iPod touch, which the newest
          # runtime can reject — try real iPhone types newest-first.
          udid=""
          for device_type in $(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.productFamily == "iPhone"
                  and (.identifier | contains("SimDeviceType.iPhone-")))]
                | .[].identifier'); do
            if udid="$(xcrun simctl create cocoa-ui-ci-tests "$device_type" "$runtime" 2>/dev/null)"; then
              echo "device type: $device_type"
              break
            fi
          done
          [[ -n "$udid" ]] || { echo "no iPhone device type accepts $runtime" >&2; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test (iOS simulator)
        env:
          COCOA_UI_IOS_SIM_UDID: ${{ steps.ios-sim.outputs.udid }}
        run: |
          xcrun simctl boot "$COCOA_UI_IOS_SIM_UDID"
          xcrun simctl bootstatus "$COCOA_UI_IOS_SIM_UDID" -b
          cargo nextest run -p cocoa-ui --locked --target aarch64-apple-ios-sim
      - name: Delete the iOS test simulator
        if: always()
        run: |
          udid="${{ steps.ios-sim.outputs.udid }}"
          if [[ -n "$udid" ]]; then
            xcrun simctl shutdown "$udid" 2>/dev/null || true
            xcrun simctl delete "$udid"
          fi
