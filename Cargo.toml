[package]
name = "cocoa-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/cocoa-ui"
readme = "README.md"
description = "A safe, idiomatic Rust API over AppKit and UIKit, built on objc2"
keywords = ["appkit", "uikit", "objc2", "macos", "ios"]
categories = ["gui", "os::macos-apis", "api-bindings"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFError",
    "CFString",
    "CFStringTokenizer",
    "CFLocale",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColor",
    "CGColorSpace",
] }
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "CTFontManager",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCharacterSet",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSRange",
    "NSKeyValueObserving",
    "NSLocale",
    "NSNotification",
    "NSValue",
    "NSObjCRuntime",
    "NSOperation",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CATransaction",
    "CAMediaTimingFunction",
    "objc2-core-foundation",
] }
# `os_log` is a family of C macros; this crate compiles the one-line wrapper
# that forwards a preformatted `%{public}s` message through them.
oslog = { version = "0.2", default-features = false }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
bitflags = "2"
mach2 = "0.7"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAppearance",
    "NSApplication",
    "NSAccessibility",
    "NSActionCell",
    "NSAttributedString",
    "block2",
    "NSCell",
    "NSColor",
    "NSColorSpace",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSParagraphStyle",
    "NSRunningApplication",
    "NSScreen",
    "NSControl",
    "NSLayoutManager",
    "NSText",
    "NSTextContainer",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextStorage",
    "NSView",
    "NSAnimation",
    "NSAnimationContext",
    "NSViewController",
    "NSWindow",
    "NSUserInterfaceLayout",
    "NSLayoutConstraint",
    "NSStringDrawing",
    "objc2-quartz-core",
    "objc2-core-graphics",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "UIApplication",
    "UIColor",
    "UIEvent",
    "UIGeometry",
    "UIInterface",
    "UIResponder",
    "UIScene",
    "UISceneOptions",
    "NSAttributedString",
    "NSLayoutManager",
    "NSParagraphStyle",
    "NSTextContainer",
    "NSTextStorage",
    "UISceneSession",
    "UITrait",
    "UIFont",
    "UILabel",
    "UIAccessibility",
    "UIFontDescriptor",
    "UITraitCollection",
    "NSText",
    "NSStringDrawing",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
    "objc2-core-graphics",
    "block2",
] }
